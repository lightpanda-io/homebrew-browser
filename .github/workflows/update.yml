name: Update Nightly Formula

on:
  schedule:
    - cron: "20 * * * *" # every hour, past 20 min. TODO we should have this triggered by the nightly build of the browser repo.
  workflow_dispatch:

jobs:
  nightly:
    name: Update nightly formula
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Compare release SHAs to formula
        id: versions
        run: |
          RELEASE=$(curl -sf "https://api.github.com/repos/lightpanda-io/browser/releases/tags/nightly")

          MACOS_AARCH64_SHA=$(echo "$RELEASE" | jq -r '.assets[] | select(.name == "lightpanda-aarch64-macos") | .digest | sub("^sha256:"; "")')
          MACOS_X86_SHA=$(echo "$RELEASE" | jq -r '.assets[] | select(.name == "lightpanda-x86_64-macos") | .digest | sub("^sha256:"; "")')
          LINUX_AARCH64_SHA=$(echo "$RELEASE" | jq -r '.assets[] | select(.name == "lightpanda-aarch64-linux") | .digest | sub("^sha256:"; "")')
          LINUX_X86_SHA=$(echo "$RELEASE" | jq -r '.assets[] | select(.name == "lightpanda-x86_64-linux") | .digest | sub("^sha256:"; "")')

          for name in MACOS_AARCH64 MACOS_X86 LINUX_AARCH64 LINUX_X86; do
            var="${name}_SHA"
            if [ -z "${!var}" ] || [ "${!var}" = "null" ]; then
              echo "::error::Release asset digest for $name is empty — aborting to avoid corrupting the formula."
              exit 1
            fi
          done

          OLD_MACOS_AARCH64_SHA=$(grep -A1 'aarch64-macos"' Formula/lightpanda.rb | grep sha256 | sed 's/.*sha256 "\([^"]*\)".*/\1/')
          OLD_MACOS_X86_SHA=$(grep -A1 'x86_64-macos"' Formula/lightpanda.rb | grep sha256 | sed 's/.*sha256 "\([^"]*\)".*/\1/')
          OLD_LINUX_AARCH64_SHA=$(grep -A1 'aarch64-linux"' Formula/lightpanda.rb | grep sha256 | sed 's/.*sha256 "\([^"]*\)".*/\1/')
          OLD_LINUX_X86_SHA=$(grep -A1 'x86_64-linux"' Formula/lightpanda.rb | grep sha256 | sed 's/.*sha256 "\([^"]*\)".*/\1/')

          CURRENT=$(grep '^  version ' Formula/lightpanda.rb | sed 's/.*"\(.*\)".*/\1/')
          LATEST=$(echo "$RELEASE" | jq -r '.updated_at' | sed 's/-/./g; s/T/./; s/://g; s/Z$//')

          echo "Current: $CURRENT — Latest: $LATEST"
          echo "Current macOS aarch64: $OLD_MACOS_AARCH64_SHA — Latest: $MACOS_AARCH64_SHA"
          echo "Current macOS x86_64:  $OLD_MACOS_X86_SHA — Latest: $MACOS_X86_SHA"
          echo "Current Linux aarch64: $OLD_LINUX_AARCH64_SHA — Latest: $LINUX_AARCH64_SHA"
          echo "Current Linux x86_64:  $OLD_LINUX_X86_SHA — Latest: $LINUX_X86_SHA"

          if [ "$MACOS_AARCH64_SHA" = "$OLD_MACOS_AARCH64_SHA" ] &&
            [ "$MACOS_X86_SHA" = "$OLD_MACOS_X86_SHA" ] &&
            [ "$LINUX_AARCH64_SHA" = "$OLD_LINUX_AARCH64_SHA" ] &&
            [ "$LINUX_X86_SHA" = "$OLD_LINUX_X86_SHA" ]; then
            echo "Formula already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "macos_aarch64_sha=$MACOS_AARCH64_SHA" >> "$GITHUB_OUTPUT"
          echo "macos_x86_sha=$MACOS_X86_SHA" >> "$GITHUB_OUTPUT"
          echo "linux_aarch64_sha=$LINUX_AARCH64_SHA" >> "$GITHUB_OUTPUT"
          echo "linux_x86_sha=$LINUX_X86_SHA" >> "$GITHUB_OUTPUT"
          echo "old_macos_aarch64_sha=$OLD_MACOS_AARCH64_SHA" >> "$GITHUB_OUTPUT"
          echo "old_macos_x86_sha=$OLD_MACOS_X86_SHA" >> "$GITHUB_OUTPUT"
          echo "old_linux_aarch64_sha=$OLD_LINUX_AARCH64_SHA" >> "$GITHUB_OUTPUT"
          echo "old_linux_x86_sha=$OLD_LINUX_X86_SHA" >> "$GITHUB_OUTPUT"

      - name: Update nightly formula
        if: steps.versions.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
          MACOS_AARCH64_SHA: ${{ steps.versions.outputs.macos_aarch64_sha }}
          MACOS_X86_SHA: ${{ steps.versions.outputs.macos_x86_sha }}
          LINUX_AARCH64_SHA: ${{ steps.versions.outputs.linux_aarch64_sha }}
          LINUX_X86_SHA: ${{ steps.versions.outputs.linux_x86_sha }}
          OLD_MACOS_AARCH64_SHA: ${{ steps.versions.outputs.old_macos_aarch64_sha }}
          OLD_MACOS_X86_SHA: ${{ steps.versions.outputs.old_macos_x86_sha }}
          OLD_LINUX_AARCH64_SHA: ${{ steps.versions.outputs.old_linux_aarch64_sha }}
          OLD_LINUX_X86_SHA: ${{ steps.versions.outputs.old_linux_x86_sha }}
        run: |
          sed -i "s|version \"${CURRENT}\"|version \"${LATEST}\"|" Formula/lightpanda.rb

          # Only substitute when the old SHA is non-empty and differs from the new one.
          # An empty old value would expand to `s||new|` ("no previous regular expression").
          replace_sha() {
            old="$1"; new="$2"
            [ -n "$old" ] && [ "$old" != "$new" ] && sed -i "s|${old}|${new}|" Formula/lightpanda.rb
            return 0
          }
          replace_sha "${OLD_MACOS_AARCH64_SHA}" "${MACOS_AARCH64_SHA}"
          replace_sha "${OLD_MACOS_X86_SHA}" "${MACOS_X86_SHA}"
          replace_sha "${OLD_LINUX_AARCH64_SHA}" "${LINUX_AARCH64_SHA}"
          replace_sha "${OLD_LINUX_X86_SHA}" "${LINUX_X86_SHA}"

      - name: Open pull request
        if: steps.versions.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "lightpanda Formula ${{ steps.versions.outputs.latest }}"
          branch: update/${{ steps.versions.outputs.latest }}
          title: "Update lightpanda Formula to ${{ steps.versions.outputs.latest }}"
          body: |
            Updates `lightpanda` Formula from `${{ steps.versions.outputs.current }}` to `${{ steps.versions.outputs.latest }}`.

            [Nightly release](https://github.com/lightpanda-io/browser/releases/tag/nightly)

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --merge ${{ steps.cpr.outputs.pull-request-number }}
