name: Update Formula

# Triggered by lightpanda-io/browser's release workflow once a release is built,
# passing the built tag:
# - "nightly" updates the lightpanda-nightly formula.
# - any other tag updates the lightpanda formula, if it is the latest release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update the formula for ("nightly", "latest" or a version tag).
        required: true
        default: nightly
        type: string

jobs:
  update:
    name: Update formula for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Update formula
        id: versions
        env:
          TAG: ${{ inputs.tag }}
        run: ./update.sh "$TAG"

      - name: Open pull request
        if: steps.versions.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.versions.outputs.formula }} Formula ${{ steps.versions.outputs.latest }}"
          branch: update/${{ steps.versions.outputs.formula }}/${{ steps.versions.outputs.latest }}
          title: "Update ${{ steps.versions.outputs.formula }} Formula to ${{ steps.versions.outputs.latest }}"
          body: |
            Updates `${{ steps.versions.outputs.formula }}` Formula from `${{ steps.versions.outputs.current }}` to `${{ steps.versions.outputs.latest }}`.

            [Release](https://github.com/lightpanda-io/browser/releases/tag/${{ steps.versions.outputs.formula == 'lightpanda-nightly' && 'nightly' || steps.versions.outputs.latest }})

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --merge ${{ steps.cpr.outputs.pull-request-number }}
